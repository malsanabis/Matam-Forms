name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate firebase-config.js
        run: |
          cat > firebase-config.js << EOF
          const firebaseConfig = {
            apiKey:            "${{ secrets.FB_API_KEY }}",
            authDomain:        "${{ secrets.FB_AUTH_DOMAIN }}",
            projectId:         "${{ secrets.FB_PROJECT_ID }}",
            storageBucket:     "${{ secrets.FB_STORAGE_BUCKET }}",
            messagingSenderId: "${{ secrets.FB_MESSAGING_SENDER_ID }}",
            appId:             "${{ secrets.FB_APP_ID }}"
          };
          EOF

      - name: Generate emailjs-config.js
        run: |
          cat > emailjs-config.js << EOF
          const ejsConfig = {
            publicKey:  "${{ secrets.EJS_PUBLIC_KEY }}",
            serviceId:  "${{ secrets.EJS_SERVICE_ID }}",
            templateId: "${{ secrets.EJS_TEMPLATE_ID }}"
          };
          EOF

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore Rules
        run: |
          echo '{ "firestore": { "rules": "firestore.rules" } }' > firebase.json
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/sa.json
          GOOGLE_APPLICATION_CREDENTIALS=/tmp/sa.json firebase deploy --only firestore:rules --project ${{ secrets.FB_PROJECT_ID }}

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: .
          branch: gh-pages
